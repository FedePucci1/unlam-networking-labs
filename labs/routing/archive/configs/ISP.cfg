interface GigabitEthernet0/0
 ip address 100.100.100.1 255.255.255.224
 duplex auto
 speed auto
 ipv6 address FE80:: link-local
 ipv6 address 2800:110:1010::/64
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Serial0/0/0
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/0/1
 ip address 11.1.1.1 255.255.255.252
 ipv6 address FE80:: link-local
 ipv6 address 2001::4/127
!
interface Serial0/1/0
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/1/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
