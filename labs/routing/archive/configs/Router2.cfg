!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Router
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO1941/K9 sn FTX1524X852-
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface GigabitEthernet0/1.30
 encapsulation dot1Q 30
 ip address 172.16.30.254 255.255.255.0
!
interface GigabitEthernet0/1.39
 no ip address
!
interface GigabitEthernet0/1.40
 encapsulation dot1Q 40
 ip address 172.16.40.254 255.255.255.0
!
interface Serial0/1/0
 ip address 11.1.1.6 255.255.255.252
 ipv6 address FE80:: link-local
 ipv6 address 2001::2/127
 clock rate 128000
!
interface Serial0/1/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan30
 mac-address 0030.f231.9301
 no ip address
 ipv6 address 2001:DB8:0:30::/64
!
interface Vlan40
 mac-address 0030.f231.9302
 no ip address
 ipv6 address 2001:DB8:0:40::/64
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
