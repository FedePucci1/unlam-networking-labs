name: Static network plans and archive integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-native.txt
      - name: Check addressing, reviewed plan and native archive
        run: python scripts/verify.py --native
